<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Family Tree</title>
<style>
:root{--bg:#131722;--panel:#1a1e29;--line:#2a2e39;--txt:#d1d4dc;--mut:#787b86;--acc:#4dd0e1;--m:#42a5f5;--f:#f06292;--o:#9e9e9e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#hdr{display:flex;align-items:center;gap:6px;padding:9px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0}
#ttl{flex:1;min-width:0;text-align:left;background:none;border:none;font-size:15px;font-weight:700;color:#fff;padding:6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cnt{font-size:11px;color:var(--mut);margin-right:4px}
.hb{background:#222736;border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:15px;min-width:34px;height:32px;padding:0 6px}
.hb:active{background:var(--line)}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;background-image:radial-gradient(#1f2433 1px,transparent 1px);background-size:22px 22px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#lines{position:absolute;left:0;top:0;pointer-events:none}
.card{position:absolute;width:112px;height:72px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--o);border-radius:8px;padding:6px 6px 4px 8px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.card.M{border-left-color:var(--m)}.card.F{border-left-color:var(--f)}
.card.late{background:#161a22}
.card.late .n{color:#b0b3bd}
.card.late .y{color:#8a8d98}
.card.sel{outline:2px solid var(--acc);background:#10252a}
.card .n{font-size:12px;font-weight:700;color:#fff;line-height:1.15;max-height:28px;overflow:hidden;word-break:break-word}
.card .y{font-size:10px;color:var(--mut);margin-top:2px}
.card .pl{font-size:10px;color:#8ab4c2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--mut);font-size:14px;text-align:center;padding:20px}
.big{background:var(--acc);color:#0b1217;border:none;border-radius:8px;font-size:14px;font-weight:700;padding:12px 18px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));display:none;z-index:20;box-shadow:0 -6px 24px #000a}
#sname{font-size:15px;font-weight:700;color:#fff}
#ssub{font-size:11px;color:var(--mut);margin:2px 0 10px}
#sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab{background:#222736;border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:13px;padding:11px 6px}
.ab:active{background:var(--line)}
.ab.dis{opacity:.4}
.ab.red{color:#ef5350}
.ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;padding-top:10vh;z-index:30}
.box{width:min(340px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.box h3{margin:0 0 10px;font-size:14px;color:#fff}
.box label{display:block;font-size:11px;color:var(--mut);margin:8px 0 3px}
.box input[type=text],.box textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:14px;padding:9px;outline:none}
.box textarea{height:130px;font-family:monospace;font-size:11px}
.box input:focus,.box textarea:focus{border-color:var(--acc)}
.box label.ckl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--txt);margin:14px 0 4px}
.ckl input{width:18px;height:18px}
.ab.tr{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px}
.ab.tr span{font-size:11px;color:var(--mut)}
.ab.tr.cur{border-color:var(--acc);background:#10252a;color:#fff}
#trList{display:grid;gap:8px;grid-template-columns:1fr;max-height:48vh;overflow-y:auto;margin-bottom:10px}
.gs{display:flex;gap:6px}
.gb{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--mut);font-size:13px;padding:9px 4px}
.gb.on{color:#fff;border-color:var(--acc);background:#10252a}
.br{display:flex;gap:8px;margin-top:14px}
.br button{flex:1;border-radius:8px;font-size:14px;font-weight:700;padding:11px;border:1px solid var(--line);background:#222736;color:var(--txt)}
.br button.ok{background:var(--acc);color:#0b1217;border-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000d;color:#fff;font-size:12px;padding:8px 14px;border-radius:16px;display:none;z-index:40;max-width:90vw;text-align:center}
</style></head>
<body>
<div id="app">
  <div id="hdr">
    <button id="ttl">🌳 Family Tree ▾</button><div id="cnt"></div>
    <button class="hb" id="bSync" style="display:none">☁</button>
    <button class="hb" id="bFit" title="Fit">⤢</button>
    <button class="hb" id="bMenu">⋮</button>
    <button class="hb" id="bClose" style="display:none" title="Band">✕</button>
  </div>
  <div id="vp">
    <div id="world"><svg id="lines" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="empty"><div>🌳<br>Tree abhi khali hai</div><button class="big" id="bFirst">➕ Pehla insaan add karo</button></div>
  </div>
</div>

<div id="sheet">
  <div id="sname"></div><div id="ssub"></div>
  <div id="sgrid">
    <button class="ab" id="aPar">⬆️ Parent add</button>
    <button class="ab" id="aSp">💍 Spouse add</button>
    <button class="ab" id="aKid">👶 Child add</button>
    <button class="ab" id="aSib">👫 Sibling add</button>
    <button class="ab" id="aEdit">✏️ Edit</button>
    <button class="ab red" id="aDel">🗑 Delete</button>
  </div>
</div>

<div class="ov" id="formOv"><div class="box">
  <h3 id="fTitle"></h3>
  <label>Naam</label><input type="text" id="fName" autocomplete="off">
  <label>Janm saal (optional)</label><input type="text" id="fYear" inputmode="numeric" maxlength="4">
  <label>📍 Kahan rehte hain — jagah (optional)</label><input type="text" id="fPlace" autocomplete="off" maxlength="60" placeholder="jaise: Jaipur, Rajasthan">
  <label>Gender</label>
  <div class="gs"><button class="gb" data-g="M">👨 Male</button><button class="gb" data-g="F">👩 Female</button><button class="gb" data-g="O">Other</button></div>
  <label class="ckl"><input type="checkbox" id="fLate"> ✝ Late (guzar chuke hain)</label>
  <div id="fDyWrap" style="display:none"><label>Guzarne ka saal (optional)</label><input type="text" id="fDy" inputmode="numeric" maxlength="4"></div>
  <div class="br"><button id="fCancel">Cancel</button><button class="ok" id="fOk">Save</button></div>
</div></div>

<div class="ov" id="menuOv"><div class="box">
  <h3>Menu</h3>
  <div style="display:grid;gap:8px;grid-template-columns:1fr">
    <button class="ab" id="mTrees">🌳 Saare trees / naya tree</button>
    <button class="ab" id="mExp">⬇️ Export (saare trees, JSON)</button>
    <button class="ab" id="mImp">⬆️ Import (naye tree ki tarah judega)</button>
    <button class="ab red" id="mClr">🗑 Is tree ko khali karo</button>
    <button class="ab" id="mCls">Band</button>
  </div>
</div></div>

<div class="ov" id="treesOv"><div class="box">
  <h3>Family Trees</h3>
  <div id="trList"></div>
  <div style="display:grid;gap:8px;grid-template-columns:1fr 1fr">
    <button class="ab" id="tNew">➕ Naya tree</button>
    <button class="ab" id="tRen">✏️ Naam badlo</button>
    <button class="ab red" id="tDel">🗑 Ye tree delete</button>
    <button class="ab" id="tCls">Band</button>
  </div>
</div></div>

<div class="ov" id="spOv"><div class="box">
  <h3>Kiske saath child add kare?</h3>
  <div id="spList" style="display:grid;gap:8px"></div>
  <div style="display:grid;gap:8px;margin-top:8px"><button class="ab" id="spCls">Cancel</button></div>
</div></div>

<div class="ov" id="impOv"><div class="box">
  <h3>Import</h3>
  <label>Export wala JSON yahan paste karo (purane trees nahi hatenge)</label>
  <textarea id="impTxt"></textarea>
  <div class="br"><button id="impCancel">Cancel</button><button class="ok" id="impOk">Import</button></div>
</div></div>

<div id="toast"></div>

<script>
//#LAYOUT-START
var CW=112,CH=72,SG=18,UG=26,VG=70,DW=14;
// people: [{id,name,year,g,parents:[ids],spouses:[ids],spouse:id|null (purane app ke liye = pehla spouse)}]
// Graph-style layout (v2): har shaadi-wala group (couple / remarriage) = ek "cluster" (ek row me).
// Har generation ki ek row. Dono taraf ke parents cluster ke upar aate hain (sasural + maayka), isliye tree tootta nahi.
// Output: har person me p.x / p.y, aur L.lines = [{pts:[[x,y],..],c:color,w:width}]
function layout(people){
  var by={},adj={},cOf={},clusters=[];
  people.forEach(function(p){by[p.id]=p;adj[p.id]=[]});
  function spOf(p){return p.spouses||(p.spouse?[p.spouse]:[])}
  function parOf(p){var r=[];(p.parents||[]).forEach(function(i){if(by[i]&&i!==p.id&&r.indexOf(i)<0)r.push(i)});return r}
  function link(a,b){if(a===b)return;if(adj[a].indexOf(b)<0)adj[a].push(b);if(adj[b].indexOf(a)<0)adj[b].push(a)}
  people.forEach(function(p){spOf(p).forEach(function(s){if(by[s])link(p.id,s)})});

  /* 1) clusters: spouse se jude log ek row me. Beech me wo jiske sabse zyada spouse; pehla spouse right, doosra left... */
  people.forEach(function(p0){
    if(cOf[p0.id])return;
    var comp=[],q=[p0.id],seen={};seen[p0.id]=1;
    while(q.length){var x=q.shift();comp.push(by[x]);adj[x].forEach(function(y){if(!seen[y]){seen[y]=1;q.push(y)}})}
    var anc=comp[0],best=-1;
    comp.forEach(function(m){var s=adj[m.id].length*10+(parOf(m).length?1:0);if(s>best){best=s;anc=m}});
    var row=[anc.id],side={},placed={},turn=0,qq=[anc.id];side[anc.id]=0;placed[anc.id]=1;
    while(qq.length){
      var x2=qq.shift();
      adj[x2].forEach(function(y){
        if(placed[y])return;placed[y]=1;
        var sd=side[x2]||((turn++%2===0)?1:-1);
        side[y]=sd;if(sd>0)row.push(y);else row.unshift(y);qq.push(y);
      });
    }
    var c={i:clusters.length,ids:row,m:row.map(function(i){return by[i]}),n:row.length,gen:0,ups:[],dns:[]};
    c.w=c.n*CW+(c.n-1)*SG;
    row.forEach(function(i){cOf[i]=c});clusters.push(c);
  });

  /* 2) generation (row) number: bacha hamesha parents se neeche; dono taraf ke parents us se ek upar */
  clusters.forEach(function(c){c.m.forEach(function(m){parOf(m).forEach(function(pid){
    var pc=cOf[pid];if(pc===c)return;
    if(c.ups.indexOf(pc)<0)c.ups.push(pc);if(pc.dns.indexOf(c)<0)pc.dns.push(c);
  })})});
  var N=clusters.length;
  for(var it=0;it<N+2;it++){var chg=false;clusters.forEach(function(c){c.ups.forEach(function(pc){if(pc.gen+1>c.gen&&c.gen<N){c.gen=pc.gen+1;chg=true}})});if(!chg)break}
  clusters.forEach(function(c){ // jinke parents nahi: bacchon ke bilkul upar rakho
    if(!c.ups.length&&c.dns.length){var g=1e9;c.dns.forEach(function(k){if(k.gen<g)g=k.gen});if(g-1>c.gen)c.gen=g-1}
  });
  var G=0;clusters.forEach(function(c){if(c.gen>G)G=c.gen});

  /* 3) graph: node = cluster; lambi (kai generation ki) line ke liye beech me dummy node */
  var nodes=[],chains={};
  function mkNode(o){o.up=[];o.dn=[];nodes.push(o);return o}
  function nlink(a,b){if(a.dn.indexOf(b)<0){a.dn.push(b);b.up.push(a)}}
  clusters.forEach(function(c){c.nd=mkNode({c:c,w:c.w,gen:c.gen,real:true})});
  clusters.forEach(function(c){c.ups.forEach(function(pc){
    if(c.gen-pc.gen<1)return;
    var prev=pc.nd,ch=[];
    for(var g=pc.gen+1;g<c.gen;g++){var d=mkNode({w:DW,gen:g,real:false});ch.push(d);nlink(prev,d);prev=d}
    nlink(prev,c.nd);chains[pc.i+'>'+c.i]=ch;
  })});

  /* 4) connected parts alag-alag order karo (crossing kam: DFS order + barycenter sweeps) */
  var parts=[],cp=0;
  nodes.forEach(function(n){n.cp=-1});
  nodes.forEach(function(n){
    if(n.cp>=0)return;
    var st=[n],list=[];n.cp=cp;
    while(st.length){var x=st.pop();list.push(x);x.up.concat(x.dn).forEach(function(y){if(y.cp<0){y.cp=cp;st.push(y)}})}
    parts.push(list);cp++;
  });
  function ykey(n){while(!n.real&&n.dn.length)n=n.dn[0];if(!n.real)return null;var y=null;n.c.m.forEach(function(m){var v=parseInt(m.year,10);if(v&&(y===null||v<y))y=v});return y}
  function sortKids(a){
    var ks=a.map(ykey);if(ks.some(function(k){return k===null}))return a;
    return a.map(function(n,i){return {n:n,k:ks[i],i:i}}).sort(function(p,q){return p.k-q.k||p.i-q.i}).map(function(o){return o.n});
  }
  function orderPart(list){
    var lay=[];for(var g=0;g<=G;g++)lay.push([]);
    var root=null;list.forEach(function(n){if(!n.up.length&&(!root||n.gen<root.gen))root=n});root=root||list[0];
    list.forEach(function(n){n.seen=0});
    (function dfs(n){if(n.seen)return;n.seen=1;lay[n.gen].push(n);sortKids(n.dn).forEach(dfs);n.up.forEach(dfs)})(root);
    function pos(){lay.forEach(function(l){l.forEach(function(n,i){n.ix=i;n.pos=(i+.5)/l.length})})}
    function cross(){
      var t=0;
      for(var g=0;g<G;g++){
        var es=[];lay[g].forEach(function(a,i){a.dn.forEach(function(b){es.push([i,b.ix])})});
        for(var i=0;i<es.length;i++)for(var j=i+1;j<es.length;j++)if((es[i][0]-es[j][0])*(es[i][1]-es[j][1])<0)t++;
      }
      return t;
    }
    function sweep(g,upDir){
      var keyed=lay[g].map(function(n,i){
        var a=upDir?n.up:n.dn,k=n.pos;
        if(a.length){var s=0;a.forEach(function(m){s+=m.pos});k=s/a.length}
        return {n:n,k:k,i:i};
      });
      keyed.sort(function(a,b){return a.k-b.k||a.i-b.i});
      lay[g]=keyed.map(function(o){return o.n});pos();
    }
    pos();
    var bestC=cross(),best=lay.map(function(l){return l.slice()});
    for(var r=0;r<10&&bestC>0;r++){
      for(var g1=1;g1<=G;g1++)sweep(g1,true);
      for(var g2=G-1;g2>=0;g2--)sweep(g2,false);
      var cc=cross();
      if(cc<bestC){bestC=cc;best=lay.map(function(l){return l.slice()})}
    }
    return best;
  }
  var layers=[];for(var g0=0;g0<=G;g0++)layers.push([]);
  parts.forEach(function(list){var lay=orderPart(list);for(var g=0;g<=G;g++)layers[g]=layers[g].concat(lay[g])});

  /* 5) x position: har row ke andar order fixed; parents bacchon ke beech me, bacche parents ke neeche (weighted least-squares) */
  function gapOf(a,b){
    if(!a.real||!b.real)return 12;
    for(var i=0;i<a.up.length;i++)if(b.up.indexOf(a.up[i])>=0)return UG;
    return UG*2;
  }
  function pava(t,wt){
    var bl=[];
    for(var i=0;i<t.length;i++){
      bl.push({v:t[i],w:wt[i],n:1});
      while(bl.length>1&&bl[bl.length-2].v>bl[bl.length-1].v){
        var b=bl.pop(),a=bl[bl.length-1];
        a.v=(a.v*a.w+b.v*b.w)/(a.w+b.w);a.w+=b.w;a.n+=b.n;
      }
    }
    var y=[];bl.forEach(function(b){for(var k=0;k<b.n;k++)y.push(b.v)});return y;
  }
  var maxW=0;
  layers.forEach(function(l){var w=0;l.forEach(function(n,i){w+=n.w+(i?gapOf(l[i-1],n):0)});l.wd=w;if(w>maxW)maxW=w});
  layers.forEach(function(l){var x=(maxW-l.wd)/2;l.forEach(function(n,i){if(i)x+=gapOf(l[i-1],n);n.x=x;x+=n.w})});
  function relax(g,upDir){
    var l=layers[g],t=[],wt=[],off=[],acc=0;
    l.forEach(function(n,i){
      if(i>0)acc+=l[i-1].w+gapOf(l[i-1],n);
      off.push(acc);
      var a=upDir?n.up:n.dn,d=n.x;
      if(a.length){var s=0;a.forEach(function(m){s+=m.x+m.w/2});d=s/a.length-n.w/2}
      t.push(d-acc);wt.push(a.length||0.01);
    });
    var y=pava(t,wt);
    l.forEach(function(n,i){n.x=y[i]+off[i]});
  }
  for(var k=0;k<24;k++){
    for(var g3=1;g3<=G;g3++)relax(g3,true);
    for(var g4=G-1;g4>=0;g4--)relax(g4,false);
  }
  var minX=1e9;nodes.forEach(function(n){if(n.x<minX)minX=n.x});
  nodes.forEach(function(n){n.x-=minX});

  /* 6) cluster ke andar members ka order: jiske parents left me wo left me */
  clusters.forEach(function(c){
    if(c.n<2)return;
    function cost(ids){
      var s=0;
      ids.forEach(function(id,i){
        var ps=parOf(by[id]).map(function(pid){return cOf[pid]}).filter(function(pc){return pc!==c});
        if(!ps.length)return;
        var t=0;ps.forEach(function(pc){t+=pc.nd.x+pc.w/2});t/=ps.length;
        s+=Math.abs(c.nd.x+i*(CW+SG)+CW/2-t);
      });
      return s;
    }
    var rev=c.ids.slice().reverse();
    if(cost(rev)<cost(c.ids)-0.5){c.ids=rev;c.m=rev.map(function(i){return by[i]})}
  });
  clusters.forEach(function(c){c.ids.forEach(function(id,i){var p=by[id];p.x=c.nd.x+i*(CW+SG);p.y=c.gen*(CH+VG)})});

  /* 7) lines: shaadi (pink) + parents->bacche (bus line) */
  var lines=[];
  function cxp(p){return p.x+CW/2}
  var anchorOf={}; // "a|b" -> {x,y}
  people.forEach(function(a){adj[a.id].forEach(function(bid){
    if(a.id>bid)return;
    var b=by[bid],c=cOf[a.id],ia=c.ids.indexOf(a.id),ib=c.ids.indexOf(bid),l=ia<ib?a:b,r=ia<ib?b:a,key=[a.id,bid].sort().join('|');
    if(Math.abs(ia-ib)===1){
      var yy=a.y+CH/2;
      lines.push({pts:[[l.x+CW,yy],[r.x,yy]],c:'#f06292',w:3});
      anchorOf[key]={x:(l.x+CW+r.x)/2,y:yy};
    }else{
      var by0=a.y+CH,dy=7*Math.abs(ia-ib);
      lines.push({pts:[[cxp(l),by0],[cxp(l),by0+dy],[cxp(r),by0+dy],[cxp(r),by0]],c:'#f06292',w:3});
      anchorOf[key]={x:(cxp(l)+cxp(r))/2,y:by0+dy};
    }
  })});
  var fams={};
  people.forEach(function(p){
    var ps=parOf(p);if(!ps.length)return;
    ps.sort();var k=ps.join('|');(fams[k]=fams[k]||{ps:ps,kids:[]}).kids.push(p);
  });
  var fl=[];
  Object.keys(fams).forEach(function(k){
    var f=fams[k],ps=f.ps.map(function(i){return by[i]}),anchors=[],gp=0;
    ps.forEach(function(p){var g=cOf[p.id].gen;if(g>gp)gp=g});
    if(ps.length===2&&anchorOf[k])anchors.push(anchorOf[k]);
    else ps.forEach(function(p){anchors.push({x:cxp(p),y:p.y+CH})});
    var pcl=null;ps.forEach(function(p){if(cOf[p.id].gen===gp)pcl=cOf[p.id]});
    var paths=[],xs=anchors.map(function(a){return a.x});
    f.kids.forEach(function(kd){
      var kc=cOf[kd.id],ch=chains[pcl.i+'>'+kc.i]||[],kx=cxp(kd);
      paths.push({kd:kd,ch:ch});
      xs.push(ch.length?ch[0].x+DW/2:kx);
    });
    fl.push({anchors:anchors,paths:paths,gp:gp,mn:Math.min.apply(null,xs),mx:Math.max.apply(null,xs)});
  });
  var byGap={};fl.forEach(function(f){(byGap[f.gp]=byGap[f.gp]||[]).push(f)});
  Object.keys(byGap).forEach(function(gk){
    var arr=byGap[gk].sort(function(a,b){return a.mn-b.mn}),ends=[];
    arr.forEach(function(f){
      var lv=0;while(lv<ends.length&&ends[lv]+8>f.mn)lv++;
      ends[lv]=f.mx;f.lv=lv;
    });
    var L=ends.length,sp=Math.min(10,(VG-24)/Math.max(L,1)),top=(+gk)*(CH+VG)+CH;
    arr.forEach(function(f){f.bus=top+VG/2-(L-1)*sp/2+f.lv*sp});
  });
  fl.forEach(function(f){
    f.anchors.forEach(function(a){lines.push({pts:[[a.x,a.y],[a.x,f.bus]],c:'#4a5068',w:2})});
    lines.push({pts:[[f.mn,f.bus],[f.mx,f.bus]],c:'#4a5068',w:2});
    f.paths.forEach(function(o){
      var kx=cxp(o.kd),ky=o.kd.y,ch=o.ch;
      if(!ch.length){lines.push({pts:[[kx,f.bus],[kx,ky]],c:'#4a5068',w:2});return}
      var pts=[],x0=ch[0].x+DW/2;
      pts.push([x0,f.bus]);
      ch.forEach(function(d,i){
        var dx=d.x+DW/2,gy=d.gen*(CH+VG)+CH+VG/2;
        if(i>0)pts.push([dx,pts[pts.length-1][1]]);
        pts.push([dx,gy]);
      });
      pts.push([kx,pts[pts.length-1][1]]);pts.push([kx,ky]);
      lines.push({pts:pts,c:'#4a5068',w:2});
    });
  });
  var W=CW,H=CH;
  nodes.forEach(function(n){if(n.x+n.w>W)W=n.x+n.w});
  people.forEach(function(p){if(p.y+CH>H)H=p.y+CH});
  return {lines:lines,w:W,h:H};
}

/* ---------- storage + server sync ---------- */
// Bridge: Lion app me window.LionRt (phone file + http), chart.html ke andar iframe me window.parent.__famBridge (web).
// Blob = {v:2, nextT, trees:[{id,name,next,people}], t}  (t = aakhri local badlav; server par kind="family" = /data/app_state/family.json)
// Whole-blob latest-wins (Income/Money/Routine jaisa). "Kaun sa tree khula hai" (cur) sirf is device me rehta hai (family_meta).
var BR=null;try{BR=window.LionRt||(window.parent&&window.parent!==window&&window.parent.__famBridge)||null}catch(e){BR=null}
var WEB=!!(BR&&BR.web),HAS=!!(BR&&BR.http);
var K='family',KM='family_meta';
function rd(k){try{if(BR){var s=BR.get(k);return s?s:null}}catch(e){}try{return localStorage.getItem('_lion_'+k)}catch(e){return null}}
function wr(k,s){try{if(BR)return !!BR.set(k,s)}catch(e){}try{localStorage.setItem('_lion_'+k,s);return true}catch(e){return false}}
var M={};try{M=JSON.parse(rd(KM)||'{}')||{}}catch(e){M={}}

//#STORE-START
function normPeople(arr){
  // spouses = saare spouses (remarriage ke liye, order me); spouse = pehla spouse (purane app/data ke liye)
  var ps=(arr||[]).map(function(p){return {id:String(p.id),name:String(p.name||''),year:String(p.year||''),g:(p.g==='M'||p.g==='F')?p.g:'O',
    parents:Array.isArray(p.parents)?p.parents.map(String):[],
    spouses:Array.isArray(p.spouses)?p.spouses.map(String):(p.spouse?[String(p.spouse)]:[]),spouse:null,
    d:!!p.d,dy:String(p.dy||''),pl:String(p.pl||'').slice(0,60)}});
  var ix={};ps.forEach(function(p){ix[p.id]=p});
  ps.forEach(function(p){p.spouses.forEach(function(s){if(ix[s]&&s!==p.id&&ix[s].spouses.indexOf(p.id)<0)ix[s].spouses.push(p.id)})});
  ps.forEach(function(p){var seen={};p.spouses=p.spouses.filter(function(s){if(!ix[s]||s===p.id||seen[s])return false;seen[s]=1;return true});p.spouse=p.spouses[0]||null});
  var mx=0;ps.forEach(function(p){var n=parseInt(p.id.replace(/\D/g,''),10);if(n>mx)mx=n});
  return {people:ps,next:mx+1};
}
// v1 ({people}) ya v2 ({trees}) dono padh leta hai -> {cur,nextT,trees}
function migrate(o){
  var st={cur:null,nextT:1,trees:[]};
  if(o&&Array.isArray(o.trees)){
    o.trees.forEach(function(t,i){
      var n=normPeople(t.people);
      st.trees.push({id:String(t.id||('t'+(i+1))),name:String(t.name||('Parivar '+(i+1))),next:Math.max(+t.next||1,n.next),people:n.people});
    });
    st.cur=o.cur;
  }else if(o&&Array.isArray(o.people)){
    var n=normPeople(o.people);
    st.trees.push({id:'t1',name:'Mera Parivar',next:Math.max(+o.next||1,n.next),people:n.people});
  }
  if(!st.trees.length)st.trees.push({id:'t1',name:'Mera Parivar',next:1,people:[]});
  var mx=0;st.trees.forEach(function(t){var n=parseInt(t.id.replace(/\D/g,''),10);if(n>mx)mx=n});
  st.nextT=Math.max(+(o&&o.nextT)||1,mx+1);
  if(!st.trees.some(function(t){return t.id===st.cur}))st.cur=st.trees[0].id;
  return st;
}
//#STORE-END
var S=migrate(null);
function curTree(){for(var i=0;i<S.trees.length;i++)if(S.trees[i].id===S.cur)return S.trees[i];return S.trees[0]}

  S.cur=S.trees.some(function(t){return t.id===c})?c:S.trees[0].id;
  var t=curTree();people=t.people;nextId=t.next;
}
function dump(){syncTree();return JSON.stringify({v:2,nextT:S.nextT,trees:S.trees,t:S.t||0})}
function save(){
  S.t=Date.now();

// ---- server sync (sirf Lion app me; web me chart.html khud server se sync karta hai) ----
var SY={err:'',last:0,busy:false,syncing:false,ver:0,p:null};
var pend={},seq=0,pt=null,lastSync=0,syncP=null;
window._lionNet=function(id,ok,payload){
  var p=pend[id];if(!p)return;
  delete pend[id];clearTimeout(p.t);
  if(ok)p.res(payload);else p.rej(new Error(String(payload)));
};
function http(method,path,body){
  return new Promise(function(res,rej){
    if(!HAS){rej(new Error('native bridge nahi'));return}
    var id=++seq;
    pend[id]={res:res,rej:rej,t:setTimeout(function(){delete pend[id];rej(new Error('timeout'))},50000)};
    try{BR.http(id,method,path,body||'')}catch(e){clearTimeout(pend[id].t);delete pend[id];rej(e)}
  }).then(function(p){return JSON.parse(p)});
}
function hasData(b){return !!(b&&Array.isArray(b.trees)&&b.trees.some(function(t){return t.people&&t.people.length}))}
function busyUI(){return ['formOv','impOv','menuOv','treesOv','spOv'].some(function(i){return $(i).style.display==='flex'})}
function chip(){
  var c=$('bSync');if(!c||WEB)return;
  var txt='☁ ✓',col='#26a69a';
  if(!HAS){txt='☁ offline';col='#848da0'}
  else if(SY.syncing||SY.busy){txt='☁ …';col='#90caf9'}
  else if(SY.err){txt='☁ ⚠';col='#ef5350';c.title=SY.err}
  else if(M.dirty){txt='☁ ↑';col='#ffb74d'}
  else if(!M.first){txt='☁ ?';col='#848da0'}
  c.textContent=txt;c.style.color=col;
}
function sched(ms){clearTimeout(pt);pt=setTimeout(function(){push()},ms)}
function parseAck(r){try{return JSON.parse(r.body)}catch(e){return null}}
function push(){
  if(SY.busy)return Promise.resolve();
  if(!HAS||!M.first||!M.dirty)return Promise.resolve();
  var raw=rd(K),payload;
  try{payload=JSON.parse(raw)}catch(e){return Promise.resolve()}
  if(!payload){M.dirty=false;saveMeta();return Promise.resolve()}
  var ver=SY.ver;SY.busy=true;chip();
  SY.p=http('POST','api/local_state_save',JSON.stringify({kind:K,seq:Date.now(),payload:payload}))
    .then(function(r){
      var a=parseAck(r);
      if(r.code===200&&a&&a.ok){if(SY.ver===ver){M.dirty=false;saveMeta()}SY.err='';SY.last=Date.now()}
      else throw new Error((a&&a.msg)||('HTTP '+r.code));
    })
    .catch(function(e){SY.err=String((e&&e.message)||e)})
    .then(function(){SY.busy=false;SY.p=null;chip();if(M.dirty&&!SY.err)sched(1500)});
  return SY.p;
}
function pull(){
  return http('GET','dav/app_state/family.json').then(function(r){
    if(r.code===401)throw new Error('Login galat (401)');
    var lv=null;try{lv=JSON.parse(rd(K))}catch(e){}
    if(r.code===404){ // server par abhi file nahi: jo phone me hai wahi bhejo
      if(hasData(lv))M.dirty=true;
      M.first=true;saveMeta();return false;
    }
    if(r.code<200||r.code>=300)throw new Error('HTTP '+r.code);
    var j;try{j=JSON.parse(r.body)}catch(e){throw new Error('server data JSON nahi hai')}
    if(!j||!Array.isArray(j.trees))throw new Error('server data ka shape galat');
    var lt=(lv&&lv.t)||0,st=j.t||0;
    if(M.first&&(M.dirty||lt>st)){M.dirty=true;saveMeta();return false}              // local aage hai: push karenge
    if(!M.first&&lv&&lt>st&&hasData(lv)){M.dirty=true;M.first=true;saveMeta();return false}
    var changed=JSON.stringify(lv)!==JSON.stringify(j);
    if(changed){
      if(busyUI())return false;                                                       // form khula hai: agle round me
      if(!M.first&&hasData(lv)){wr('family_prev',rd(K)||'')}                           // pehli baar: purana local copy bacha ke rakho
      wr(K,r.body);
    }
    M.first=true;M.dirty=false;saveMeta();
    return changed;
  });
}
function syncNow(manual){
  if(!HAS){if(manual)toast('Server sync sirf Lion app me chalta hai');return Promise.resolve()}
  if(syncP)return syncP;
  if(!manual&&Date.now()-lastSync<15000)return Promise.resolve();
  SY.syncing=true;SY.err='';chip();
  var chg=false;
  syncP=pull().then(function(c){chg=c;return push()})
    .then(function(){SY.last=Date.now();if(chg){load();sel=null;closeSheet();render(true)}})
    .catch(function(e){SY.err=String((e&&e.message)||e);if(manual)toast('⚠ '+SY.err)})
    .then(function(){SY.syncing=false;syncP=null;lastSync=Date.now();chip();if(manual&&!SY.err)toast('☁ Sync ho gaya')});
  return syncP;
}
window._lionFlush=function(){clearTimeout(pt);return Promise.resolve(SY.p||0).then(function(){return push()})};
window._lionExit=function(){
  var done=false;
  function go(){if(done)return;done=true;try{BR.close()}catch(e){}}
  setTimeout(go,4000);
  window._lionFlush().then(go,go);
};

/* ---------- render ---------- */
var tx=0,ty=0,sc=1,vpW=0,vpH=0;
var world=$('world'),vp=$('vp'),svg=$('lines');
function applyT(){world.style.transform='translate('+tx+'px,'+ty+'px) scale('+sc+')'}
function yearLine(p){
  var t='';
  if(p.d)t='✝'+((p.year||p.dy)?' '+(p.year||'?')+'–'+(p.dy||'?'):'');

      +'<div class="n">'+(p.d?'Late ':'')+esc(p.name||'(naam nahi)')+'</div>'+yearLine(p)+(p.pl?'<div class="pl">📍 '+esc(p.pl)+'</div>':'')+'</div>';

function fit(){

  sc=Math.max(0.25,Math.min(1,vpW/W,vpH/H));

/* ---------- pan / pinch-zoom / tap ---------- */
var pts={},st=null,moved=false,tapEl=null,pin=null;
function cnt(){return Object.keys(pts).length}
vp.addEventListener('pointerdown',function(e){
  if(e.target.closest('#empty'))return;
  try{vp.setPointerCapture(e.pointerId)}catch(_){}
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  var n=cnt();
  if(n==1){st={x:e.clientX,y:e.clientY,tx:tx,ty:ty};moved=false;var c=e.target.closest('.card');tapEl=c?c.getAttribute('data-id'):null;pin=null}
  else if(n==2){
    var a=Object.keys(pts).map(function(k){return pts[k]});
    var r=vp.getBoundingClientRect();
    pin={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,sc:sc,tx:tx,ty:ty,mx:(a[0].x+a[1].x)/2-r.left,my:(a[0].y+a[1].y)/2-r.top};
    moved=true;
  }
});
vp.addEventListener('pointermove',function(e){
  if(!pts[e.pointerId])return;
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  var n=cnt();
  if(n==1&&st){
    var dx=e.clientX-st.x,dy=e.clientY-st.y;
    if(!moved&&Math.abs(dx)+Math.abs(dy)>8)moved=true;
    if(moved){tx=st.tx+dx;ty=st.ty+dy;applyT()}
  }else if(n>=2&&pin){
    var a=Object.keys(pts).map(function(k){return pts[k]});
    var r=vp.getBoundingClientRect();
    var d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
    var ns=Math.max(0.2,Math.min(3,pin.sc*d/pin.d));
    var mx=(a[0].x+a[1].x)/2-r.left,my=(a[0].y+a[1].y)/2-r.top;
    var wx=(pin.mx-pin.tx)/pin.sc,wy=(pin.my-pin.ty)/pin.sc;
    sc=ns;tx=mx-wx*ns;ty=my-wy*ns;applyT();
  }
});
function endPtr(e){
  if(!pts[e.pointerId])return;
  delete pts[e.pointerId];
  var n=cnt();
  if(n==0){
    if(e.type==='pointerup'&&!moved&&st){ if(tapEl)select(tapEl);else closeSheet() }
    st=null;pin=null;tapEl=null;
  }else if(n==1){
    var k=Object.keys(pts)[0];
    st={x:pts[k].x,y:pts[k].y,tx:tx,ty:ty};pin=null;moved=true;
  }
}
vp.addEventListener('pointerup',endPtr);
vp.addEventListener('pointercancel',endPtr);
vp.addEventListener('wheel',function(e){
  e.preventDefault();
  var r=vp.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  var ns=Math.max(0.2,Math.min(3,sc*(e.deltaY<0?1.12:0.89)));
  var wx=(mx-tx)/sc,wy=(my-ty)/sc;sc=ns;tx=mx-wx*ns;ty=my-wy*ns;applyT();
},{passive:false});

}
function mk(n,y,g,parents,spouse,late,dy,pl){var p={id:'p'+(nextId++),name:n,year:y,g:g,parents:parents||[],spouses:spouse?[spouse]:[],spouse:spouse||null,d:!!late,dy:dy||'',pl:pl||''};people.push(p);return p}

$('aSp').onclick=function(){

  var n0=(p.spouses||[]).filter(byId).length;
  openForm((n0?'Dusra spouse add — ':'Spouse add — ')+p.name,'','',opp(p.g),false,'',function(n,y,g,l,dy,pl){
    var np=mk(n,y,g,[],null,l,dy,pl);addSp(p,np);changed(p.id);
  });
};
var spCb=null;
function pickSp(p,cb){
  var sps=(p.spouses||[]).map(byId).filter(Boolean);
  if(sps.length<2){cb(sps[0]||null);return}
  var h='';sps.forEach(function(s){h+='<button class="ab" data-s="'+esc(s.id)+'">💍 '+esc(s.name)+' ke saath</button>'});
  h+='<button class="ab" data-s="">Sirf '+esc(p.name)+' ke (bina spouse)</button>';
  $('spList').innerHTML=h;spCb=cb;$('spOv').style.display='flex';
}
$('spList').addEventListener('click',function(e){
  var b=e.target.closest('.ab');if(!b)return;
  var id=b.getAttribute('data-s'),cb=spCb;spCb=null;$('spOv').style.display='none';
  if(cb)cb(id?byId(id):null);
});
$('spCls').onclick=function(){spCb=null;$('spOv').style.display='none'};
$('aKid').onclick=function(){
  var p=byId(sel);if(!p)return;
  pickSp(p,function(s){
    openForm('Child add — '+p.name+(s?' & '+s.name:''),'','','M',false,'',function(n,y,g,l,dy,pl){
      var ps=[p.id];if(s)ps.push(s.id);
      var c=mk(n,y,g,ps,null,l,dy,pl);changed(c.id);
    });
  });
};
$('aSib').onclick=function(){
  var p=byId(sel);if(!p)return;
  var par=p.parents.filter(byId);
  if(!par.length){toast('Pehle Parent add karo, phir Sibling');return}
  openForm('Sibling add — '+p.name,'','','M',false,'',function(n,y,g,l,dy,pl){
    var c=mk(n,y,g,par.slice(),null,l,dy,pl);changed(c.id);
  });
};
$('aEdit').onclick=function(){
  var p=byId(sel);if(!p)return;
  openForm('Edit',p.name,p.year,p.g,p.d,p.dy,function(n,y,g,l,dy,pl){p.name=n;p.year=y;p.g=g;p.d=l;p.dy=dy;p.pl=pl;changed(p.id)},p.pl);
};
$('aDel').onclick=function(){
  var p=byId(sel);if(!p)return;
  if(!confirm(p.name+' ko tree se hataye?\n(Iske rishtedar tree me rahenge)'))return;
  people=people.filter(function(q){return q.id!==p.id});
  people.forEach(function(q){q.parents=q.parents.filter(function(i){return i!==p.id});q.spouses=(q.spouses||[]).filter(function(i){return i!==p.id});q.spouse=q.spouses[0]||null});
  changed(null);
};

/* ---------- menu: export / import / clear ---------- */
$('bMenu').onclick=function(){$('menuOv').style.display='flex'};
$('mCls').onclick=function(){$('menuOv').style.display='none'};
$('mTrees').onclick=function(){$('menuOv').style.display='none';showTrees()};
$('ttl').onclick=showTrees;
$('mExp').onclick=function(){
  $('menuOv').style.display='none';
  var s=dump();
  if(!S.trees.some(function(t){return t.people.length})){toast('Export karne ko kuch nahi');return}
  try{
    if(BR&&BR.saveFile){BR.saveFile('family_trees.json',s)}
    else{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='family_trees.json';a.click()}
  }catch(e){toast('Export fail')}
};
$('mImp').onclick=function(){$('menuOv').style.display='none';$('impTxt').value='';$('impOv').style.display='flex'};
$('impCancel').onclick=function(){$('impOv').style.display='none'};
$('impOk').onclick=function(){
  try{
    var o=JSON.parse($('impTxt').value.trim());
    if(!o||!(Array.isArray(o.trees)||Array.isArray(o.people)))throw new Error('bad');
    var st=migrate(o);syncTree();var first=null;
    st.trees.forEach(function(t){t.id='t'+(S.nextT++);S.trees.push(t);if(!first)first=t.id});
    $('impOv').style.display='none';
    save();switchTree(first);toast(st.trees.length+' tree import hue');
  }catch(e){toast('JSON galat hai')}
};
$('mClr').onclick=function(){
  $('menuOv').style.display='none';
  if(!confirm('"'+curTree().name+'" ke saare log hatao? Ye wapas nahi aayega.'))return;
  people=[];nextId=1;closeSheet();save();render(false);
};

/* ---------- trees manager ---------- */
function showTrees(){
  syncTree();
  var h='';
  S.trees.forEach(function(t){
    h+='<button class="ab tr'+(t.id===S.cur?' cur':'')+'" data-t="'+esc(t.id)+'"><b>🌳 '+esc(t.name)+'</b><span>'+t.people.length+' log</span></button>';
  });
  $('trList').innerHTML=h;
  $('treesOv').style.display='flex';
}
$('trList').addEventListener('click',function(e){
  var b=e.target.closest('.tr');if(!b)return;
  $('treesOv').style.display='none';
  var id=b.getAttribute('data-t');if(id!==S.cur)switchTree(id);
});
$('tCls').onclick=function(){$('treesOv').style.display='none'};
$('tNew').onclick=function(){
  var n=prompt('Naye tree ka naam','Parivar '+(S.trees.length+1));
  if(n===null)return;n=n.trim();if(!n){toast('Naam likho');return}
  syncTree();
  var t={id:'t'+(S.nextT++),name:n,next:1,people:[]};S.trees.push(t);
  save();$('treesOv').style.display='none';switchTree(t.id);
};
$('tRen').onclick=function(){
  var t=curTree(),n=prompt('Tree ka naam',t.name);
  if(n===null)return;n=n.trim();if(!n){toast('Naam likho');return}
  t.name=n;save();setTitle();showTrees();
};
$('tDel').onclick=function(){
  var t=curTree();
  if(!confirm('"'+t.name+'" tree poora delete kare ('+people.length+' log)? Ye wapas nahi aayega.'))return;
  syncTree();
  S.trees=S.trees.filter(function(x){return x.id!==t.id});
  if(!S.trees.length)S.trees.push({id:'t'+(S.nextT++),name:'Mera Parivar',next:1,people:[]});
  save();$('treesOv').style.display='none';switchTree(S.trees[0].id);
};
$('bFit').onclick=fit;

/* Android back: pehle khule popup/sheet band karo; true = hum ne handle kar liya */
window._lionBack=function(){
  var ids=['formOv','impOv','menuOv','treesOv','spOv'];
  for(var i=0;i<ids.length;i++){var e=$(ids[i]);if(e.style.display==='flex'){if(ids[i]==='formOv')closeForm();else e.style.display='none';return true}}
  if($('sheet').style.display==='block'){closeSheet();return true}
  return false;
};
window.addEventListener('resize',function(){setTimeout(function(){if(!sel)fit()},100)});

if(WEB)$('bClose').style.display='';
if(!WEB){$('bSync').style.display='';$('bSync').onclick=function(){syncNow(true)}}
$('bClose').onclick=function(){try{BR.close()}catch(e){}};
load();render(false);chip();
if(HAS){
  syncNow(false);
  setInterval(function(){
    if(SY.syncing)return;
    if(!M.first){syncNow(false);return}
    if(M.dirty){SY.err='';push();return}
    if(!document.hidden&&Date.now()-lastSync>120000)syncNow(false);
  },30000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)syncNow(false)});
}
</script>
