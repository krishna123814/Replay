<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Income Source</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#131722;color:#d1d4dc;font-family:-apple-system,Roboto,Arial,sans-serif;font-size:13px}
#app{position:relative;display:flex;flex-direction:column;height:100%;overflow:hidden}
#hdr{display:flex;align-items:center;gap:6px;padding:9px 10px;background:#1e222d;border-bottom:1px solid #2a2e39;flex-shrink:0}
#hdr b{flex:1;font-size:14px;color:#fff}
#hdr button{background:transparent;border:1px solid #2a2e39;border-radius:6px;color:#d1d4dc;font-size:14px;padding:2px 9px;cursor:pointer;font-family:inherit}
#lion-sync{font-size:12px!important}
#body{flex:1;overflow-y:auto;padding:0 0 78px}
.sum{display:flex;gap:8px;padding:10px 10px 6px}
.sum>div{flex:1;background:#1e222d;border:1px solid #2a2e39;border-radius:10px;padding:8px 10px}
.sum span{display:block;font-size:11px;color:#848da0}
.sum b{font-size:15px;color:#26a69a}
.sum>div:first-child b{color:#fff}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #1e222d;cursor:pointer}
.row:active{background:#1e222d}
.row.off{opacity:.5}
.ic{width:34px;height:34px;border-radius:50%;background:#1e3a5f;color:#90caf9;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex-shrink:0}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:14px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm i{display:block;font-style:normal;font-size:11px;color:#848da0;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.am{font-size:14px;color:#26a69a;white-space:nowrap}
.offtag{font-size:10px;border:1px solid #2a2e39;border-radius:8px;padding:0 6px;color:#848da0;margin-left:6px}
.empty{padding:28px 18px;text-align:center;color:#848da0;line-height:1.6}
.row.sub{padding:7px 12px 7px 36px;background:#161a25}
.row.sub .ic{width:26px;height:26px;font-size:12px;background:#24304a}
.row.sub .nm b{font-size:13px;font-weight:500}
.addsub{flex-shrink:0;background:transparent;border:1px solid #2a2e39;color:#90caf9;border-radius:12px;font-size:11px;padding:3px 9px;font-family:inherit;cursor:pointer}
.subcnt{font-size:10px;color:#848da0;margin-left:6px;font-weight:400}
.sublist{background:#131722;border:1px solid #2a2e39;border-radius:8px;margin-bottom:6px;overflow:hidden}
.sublist .row{padding:8px 10px}
.sublist .none{padding:8px 10px;color:#848da0;font-size:12px}
.hint{font-size:11px;color:#848da0;margin-top:4px}
.sheet input:disabled{opacity:.6}
#fab{position:absolute;right:16px;bottom:16px;width:52px;height:52px;border-radius:50%;border:0;background:#ff6150;color:#fff;font-size:30px;line-height:50px;cursor:pointer;box-shadow:0 4px 14px #0008;padding:0}
#modal{display:none;position:absolute;inset:0;background:#000a;align-items:flex-end}
.sheet{width:100%;max-height:100%;overflow-y:auto;background:#1e222d;border-radius:14px 14px 0 0;padding:10px 12px 16px}
.sh-h{display:flex;align-items:center;margin-bottom:8px}.sh-h b{flex:1;font-size:14px;color:#fff}
.sh-h button{background:transparent;border:0;color:#d1d4dc;font-size:18px;cursor:pointer}
.sheet label{display:block;font-size:11px;color:#848da0;margin:9px 0 4px}
.sheet input{width:100%;background:#131722;border:1px solid #2a2e39;border-radius:8px;color:#fff;padding:8px 10px;font-size:14px;color-scheme:dark;font-family:inherit}
.tg{display:flex;gap:8px}
.tg button{flex:1;padding:8px;background:#131722;border:1px solid #2a2e39;border-radius:8px;color:#9598a1;font-size:14px;cursor:pointer;font-family:inherit}
.tg button.on.inc{border-color:#26a69a;color:#26a69a}.tg button.on.exp{border-color:#ef5350;color:#ef5350}
.err{color:#ef5350;font-size:12px;min-height:16px;margin-top:6px}
.btns{display:flex;gap:8px;margin-top:6px}
.btns button{flex:1;padding:11px;border-radius:8px;border:1px solid #2a2e39;background:#131722;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.btns button.pri{background:#2962ff;border-color:#2962ff}
.btns button.del{flex:0 0 auto;padding:11px 16px;color:#ef5350;border-color:#ef5350}
.btns button.del.cf{background:#ef5350;color:#fff}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#2a2e39;color:#fff;padding:8px 14px;border-radius:18px;font-size:12px;display:none;max-width:90%;z-index:50}
</style></head>
<body>
<div id="app">
  <div id="hdr"><b>🏦 Income Source</b><button id="lion-sync" type="button">☁ ?</button><button type="button" onclick="toggleIncomeSrc()" aria-label="Close">✕</button></div>
  <div id="body"></div>
  <button id="fab" type="button" onclick="openEdit('')" aria-label="Naya source">+</button>
  <div id="modal"></div>
</div>
<div id="toast"></div>
<script>
// ═══ 🏦 Income Source (Lion standalone) — chart.html wale panel jaisa; data: phone par local copy + server sync ═══
// Local: LionRt.get/set('incomesrc') (+ 'incomesrc_meta'). Server: GET dav/app_state/incomesrc.json, save = POST api/local_state_save {kind:'incomesrc'}.
// Blob = {v:1, src:[{id,name,amt,note,on,t}], t}. Whole-blob latest-wins (Money Manager / Routine jaisa).
(function () {
  var HAS = !!(window.LionRt && LionRt.http);
  var K = 'incomesrc', KM = 'incomesrc_meta';
  function rd(k) {
    try { if (window.LionRt) { var s = LionRt.get(k); return s ? s : null; } } catch (e) {}
    try { return localStorage.getItem('_lion_' + k); } catch (e) { return null; }
  }
  function wr(k, s) {
    try { if (window.LionRt) return !!LionRt.set(k, s); } catch (e) {}
    try { localStorage.setItem('_lion_' + k, s); return true; } catch (e) { return false; }
  }
  function $(id) { return document.getElementById(id); }
  function esc(x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function inr(n) { return '\u20b9' + (Number(n) || 0).toLocaleString('en-IN', { maximumFractionDigits: 2 }); }
  function uid() { return 'is' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function subsOf(s) { return (s && Array.isArray(s.subs)) ? s.subs : []; }
  function subsTotal(s) { return subsOf(s).reduce(function (a, x) { return a + (x && x.on !== false ? (Number(x.amt) || 0) : 0); }, 0); }
  // parent ka amt = chalu subs ka total (agar subs me amount hai) — chart.html ka purana panel bhi sahi total dikhaye
  function recalc(s) { var t = subsTotal(s); if (t > 0) s.amt = t; }
  function toast(m) { var t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = 'none'; }, 2500); }

  // ── native transport ──
  var pend = {}, seq = 0;
  window._lionNet = function (id, ok, payload) {
    var p = pend[id]; if (!p) return;
    delete pend[id]; clearTimeout(p.t);
    if (ok) p.res(payload); else p.rej(new Error(String(payload)));
  };
  function http(method, path, body) {
    return new Promise(function (res, rej) {
      if (!HAS) { rej(new Error('native bridge nahi')); return; }
      var id = ++seq;
      pend[id] = { res: res, rej: rej, t: setTimeout(function () { delete pend[id]; rej(new Error('timeout')); }, 50000) };
      try { LionRt.http(id, method, path, body || ''); } catch (e) { clearTimeout(pend[id].t); delete pend[id]; rej(e); }
    }).then(function (p) { return JSON.parse(p); });
  }

  // ── data ──
  var M = {};
  try { M = JSON.parse(rd(KM) || '{}') || {}; } catch (e) { M = {}; }
  var S = { err: '', last: 0, busy: false, syncing: false, ver: 0 };
  function saveMeta() { wr(KM, JSON.stringify(M)); }
  function load() {
    try { var r = rd(K); if (r) { var j = JSON.parse(r); if (j && Array.isArray(j.src)) return j; } } catch (e) {}
    return { v: 1, src: [], t: 0 };
  }
  function persist(b) {
    b.t = Date.now();
    if (!wr(K, JSON.stringify(b))) return false;
    S.ver++; M.dirty = true; saveMeta(); sched(1200); chip();
    return true;
  }

  // ── sync ──
  var pt = null;
  function sched(ms) { clearTimeout(pt); pt = setTimeout(function () { push(); }, ms); }
  function chip() {
    var c = $('lion-sync'); if (!c) return;
    var txt = '☁ ✓', col = '#26a69a';
    if (!HAS) { txt = '☁ offline'; col = '#848da0'; }
    else if (S.syncing || S.busy) { txt = '☁ …'; col = '#90caf9'; }
    else if (S.err) { txt = '☁ ⚠'; col = '#ef5350'; c.title = S.err; }
    else if (M.dirty) { txt = '☁ ↑'; col = '#ffb74d'; }
    else if (!M.first) { txt = '☁ ?'; col = '#848da0'; }
    c.textContent = txt; c.style.color = col;
  }
  function parseAck(r) { try { return JSON.parse(r.body); } catch (e) { return null; } }
  function push() {
    if (S.busy) return Promise.resolve();
    if (!HAS || !M.first || !M.dirty) return Promise.resolve();
    var raw = rd(K), payload;
    try { payload = JSON.parse(raw); } catch (e) { return Promise.resolve(); }
    if (!payload) { M.dirty = false; saveMeta(); return Promise.resolve(); }
    var ver = S.ver; S.busy = true; chip();
    S.p = http('POST', 'api/local_state_save', JSON.stringify({ kind: K, seq: Date.now(), payload: payload }))
      .then(function (r) {
        var a = parseAck(r);
        if (r.code === 200 && a && a.ok) { if (S.ver === ver) { M.dirty = false; saveMeta(); } S.err = ''; S.last = Date.now(); }
        else throw new Error((a && a.msg) || ('HTTP ' + r.code));
      })
      .catch(function (e) { S.err = String((e && e.message) || e); })
      .then(function () { S.busy = false; S.p = null; chip(); if (M.dirty && !S.err) sched(1500); });
    return S.p;
  }
  function pull() {
    return http('GET', 'dav/app_state/incomesrc.json').then(function (r) {
      if (r.code === 401) throw new Error('Login galat (401)');
      var lv = null; try { lv = JSON.parse(rd(K)); } catch (e) {}
      if (r.code === 404) {   // server par abhi file nahi: jo phone me hai wahi bhejo
        if (lv && lv.src && lv.src.length) { M.dirty = true; }
        M.first = true; saveMeta(); return false;
      }
      if (r.code < 200 || r.code >= 300) throw new Error('HTTP ' + r.code);
      var j; try { j = JSON.parse(r.body); } catch (e) { throw new Error('server data JSON nahi hai'); }
      if (!j || !Array.isArray(j.src)) throw new Error('server data ka shape galat');
      var lt = (lv && lv.t) || 0, st = j.t || 0;
      if (M.first && (M.dirty || lt > st)) { M.dirty = true; saveMeta(); return false; }   // local aage hai: push karenge
      if (!M.first && lv && lt > st && lv.src && lv.src.length) { M.dirty = true; M.first = true; saveMeta(); return false; }
      var changed = JSON.stringify(lv) !== JSON.stringify(j);
      if (changed) wr(K, r.body);
      M.first = true; M.dirty = false; saveMeta();
      return changed;
    });
  }
  var lastSync = 0, syncP = null;
  function syncNow(manual) {
    if (!HAS) { if (manual) toast('Server sync sirf Lion app me chalta hai'); return Promise.resolve(); }
    if (syncP) return syncP;
    if (!manual && Date.now() - lastSync < 15000) return Promise.resolve();
    S.syncing = true; S.err = ''; chip();
    var chg = false;
    syncP = pull().then(function (c) { chg = c; return push(); })
      .then(function () { S.last = Date.now(); if (chg) render(); })
      .catch(function (e) { S.err = String((e && e.message) || e); if (manual) toast('⚠ ' + S.err); })
      .then(function () { S.syncing = false; syncP = null; lastSync = Date.now(); chip(); if (manual && !S.err) toast('☁ Sync ho gaya'); });
    return syncP;
  }
  window._lionFlush = function () { clearTimeout(pt); return Promise.resolve(S.p || 0).then(function () { return push(); }); };
  window._lionExit = function () {
    var done = false;
    function go() { if (done) return; done = true; try { LionRt.close(); } catch (e) {} }
    setTimeout(go, 4000);
    window._lionFlush().then(go, go);
  };
  window._lionBack = function () {
    var m = $('modal');
    if (m && m.style.display === 'flex') { closeModal(); return true; }
    return false;
  };
  setInterval(function () {
    if (!HAS || S.syncing) return;
    if (!M.first) { syncNow(false); return; }
    if (M.dirty) { S.err = ''; push(); return; }
    if (!document.hidden && Date.now() - lastSync > 120000) syncNow(false);
  }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) syncNow(false); });
  $('lion-sync').onclick = function () { syncNow(true); };

  // ── UI ──
  function render() {
    var b = load();
    var act = b.src.filter(function (s) { return s && s.on !== false; });
    var tot = act.reduce(function (a, s) { return a + (Number(s.amt) || 0); }, 0);
    var h = '<div class="sum"><div><span>Chalu sources</span><b>' + act.length + ' / ' + b.src.length + '</b></div>'
          + '<div><span>Andaaza / mahina</span><b>' + inr(tot) + '</b></div></div>';
    if (!b.src.length) {
      h += '<div class="empty">Abhi koi income source nahi hai.<br>Neeche <b>+</b> dabake apna pehla source jodo<br>(jaise Salary, Trading, Rent, Freelance).</div>';
    } else {
      b.src.slice().sort(function (x, y) { return (x.on === false) - (y.on === false); }).forEach(function (s) {
        var nm = String(s.name || '?');
        var sb = subsOf(s);
        h += '<div class="row' + (s.on === false ? ' off' : '') + '" onclick="openEdit(\'' + esc(s.id) + '\')">'
          + '<div class="ic">' + esc(nm.charAt(0).toUpperCase()) + '</div>'
          + '<div class="nm"><b>' + esc(nm) + (s.on === false ? '<span class="offtag">band</span>' : '') + (sb.length ? '<span class="subcnt">' + sb.length + ' sub</span>' : '') + '</b>'
          + (s.note ? '<i>' + esc(s.note) + '</i>' : '') + '</div>'
          + (Number(s.amt) > 0 ? '<div class="am">' + inr(s.amt) + '</div>' : '')
          + '<button type="button" class="addsub" onclick="event.stopPropagation();openSub(\'' + esc(s.id) + '\',\'\')">\uff0b sub</button></div>';
        sb.forEach(function (c) {
          var cn = String(c.name || '?');
          h += '<div class="row sub' + ((s.on === false || c.on === false) ? ' off' : '') + '" onclick="openSub(\'' + esc(s.id) + '\',\'' + esc(c.id) + '\')">'
            + '<div class="ic">' + esc(cn.charAt(0).toUpperCase()) + '</div>'
            + '<div class="nm"><b>' + esc(cn) + (c.on === false ? '<span class="offtag">band</span>' : '') + '</b>'
            + (c.note ? '<i>' + esc(c.note) + '</i>' : '') + '</div>'
            + (Number(c.amt) > 0 ? '<div class="am">' + inr(c.amt) + '</div>' : '') + '</div>';
        });
      });
    }
    $('body').innerHTML = h;
  }
  var formOn = true;
  function closeModal() { var m = $('modal'); m.style.display = 'none'; m.innerHTML = ''; }
  function setOn(v) {
    formOn = !!v;
    var a = $('f-on'), b = $('f-off'); if (!a || !b) return;
    a.className = v ? 'on inc' : ''; b.className = v ? '' : 'on exp';
  }
  function openEdit(id) {
    var s = null;
    if (id) s = load().src.filter(function (x) { return x.id === id; })[0] || null;
    var m = $('modal');
    m.innerHTML = '<div class="sheet" onclick="event.stopPropagation()">'
      + '<div class="sh-h"><b>' + (s ? 'Source badlo' : 'Naya Income Source') + '</b><button type="button" onclick="closeModal()" aria-label="Close">\u2715</button></div>'
      + '<label>Source ka naam *</label><input id="f-name" type="text" maxlength="40" placeholder="jaise Salary / Trading / Rent" value="' + esc(s ? s.name : '') + '">'
      + '<label>Andaaza mahine ka (\u20b9, optional)</label><input id="f-amt" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="' + (s && Number(s.amt) > 0 ? esc(s.amt) : '') + '"' + (s && subsTotal(s) > 0 ? ' disabled' : '') + '>'
      + (s && subsTotal(s) > 0 ? '<div class="hint">Sub-categories ka total apne aap judta hai</div>' : '')
      + '<label>Note (optional)</label><input id="f-note" type="text" maxlength="120" placeholder="jaise 1 tareekh ko aata hai" value="' + esc(s ? s.note : '') + '">'
      + '<label>Sub-categories (jaise Option market, Cash market)</label>'
      + (s ? '<div class="sublist">' + (subsOf(s).length ? subsOf(s).map(function (c) {
            return '<div class="row' + (c.on === false ? ' off' : '') + '" onclick="openSub(\'' + esc(s.id) + '\',\'' + esc(c.id) + '\')"><div class="nm"><b>' + esc(c.name) + (c.on === false ? '<span class="offtag">band</span>' : '') + '</b></div>'
              + (Number(c.amt) > 0 ? '<div class="am">' + inr(c.amt) + '</div>' : '') + '</div>';
          }).join('') : '<div class="none">Abhi koi sub-category nahi</div>') + '</div>'
          + '<button type="button" class="addsub" onclick="openSub(\'' + esc(s.id) + '\',\'\')">\uff0b Sub-category jodo</button>'
        : '<div class="hint">Pehle Save karo, phir sub-category jod sakte ho</div>')
      + '<label>Status</label><div class="tg"><button type="button" id="f-on" onclick="setOn(true)">Chalu</button><button type="button" id="f-off" onclick="setOn(false)">Band</button></div>'
      + '<div class="err" id="err"></div>'
      + '<div class="btns"><button type="button" class="pri" onclick="saveSrc(\'' + esc(id || '') + '\')">Save</button>'
      + (s ? '<button type="button" class="del" id="delbtn" onclick="delSrc(\'' + esc(id) + '\')">\ud83d\uddd1 Delete</button>' : '') + '</div></div>';
    m.style.display = 'flex'; m.onclick = closeModal;
    setOn(!s || s.on !== false);
    if (!s) setTimeout(function () { try { $('f-name').focus(); } catch (e) {} }, 60);
  }
  function saveSrc(id) {
    var name = ($('f-name').value || '').trim().replace(/\s+/g, ' ');
    var amtRaw = ($('f-amt').value || '').trim();
    var note = ($('f-note').value || '').trim();
    var err = $('err');
    if (!name) { err.textContent = 'Source ka naam likho'; return; }
    var amt = 0;
    if (amtRaw !== '') { amt = Number(amtRaw); if (!isFinite(amt) || amt < 0) { err.textContent = 'Amount sahi likho (0 ya zyada)'; return; } }
    var b = load();
    if (b.src.some(function (x) { return x.id !== id && String(x.name || '').trim().toLowerCase() === name.toLowerCase(); })) { err.textContent = 'Ye naam pehle se hai'; return; }
    var now = Date.now();
    if (id) {
      var s = b.src.filter(function (x) { return x.id === id; })[0];
      if (!s) { closeModal(); return; }
      s.name = name; s.amt = amt; s.note = note; s.on = formOn; s.t = now; recalc(s);
    } else {
      b.src.push({ id: uid(), name: name, amt: amt, note: note, on: formOn, t: now });
    }
    if (!persist(b)) { err.textContent = 'Save nahi hua (phone storage)'; return; }
    closeModal(); render();
  }
  function delSrc(id) {
    var btn = $('delbtn'); if (!btn) return;
    if (!btn.classList.contains('cf')) {
      btn.classList.add('cf'); var _cs = load().src.filter(function (x) { return x.id === id; })[0]; btn.textContent = (_cs && subsOf(_cs).length) ? 'Pakka? (' + subsOf(_cs).length + ' sub bhi)' : 'Pakka delete?';
      setTimeout(function () { var x = $('delbtn'); if (x) { x.classList.remove('cf'); x.textContent = '\ud83d\uddd1 Delete'; } }, 3500);
      return;
    }
    var b = load();
    b.src = b.src.filter(function (x) { return x.id !== id; });
    persist(b); closeModal(); render();
  }
  function openSub(pid, sid) {
    var b = load(), p = b.src.filter(function (x) { return x.id === pid; })[0]; if (!p) return;
    var c = sid ? (subsOf(p).filter(function (x) { return x.id === sid; })[0] || null) : null;
    var m = $('modal');
    m.innerHTML = '<div class="sheet" onclick="event.stopPropagation()">'
      + '<div class="sh-h"><b>' + (c ? 'Sub-category badlo' : 'Naya Sub-category') + ' \u00b7 ' + esc(p.name) + '</b><button type="button" onclick="closeModal()" aria-label="Close">\u2715</button></div>'
      + '<label>Naam *</label><input id="f-name" type="text" maxlength="40" placeholder="jaise Option market / Cash market / BTC option" value="' + esc(c ? c.name : '') + '">'
      + '<label>Andaaza mahine ka (\u20b9, optional)</label><input id="f-amt" type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="' + (c && Number(c.amt) > 0 ? esc(c.amt) : '') + '">'
      + '<label>Note (optional)</label><input id="f-note" type="text" maxlength="120" value="' + esc(c ? c.note : '') + '">'
      + '<label>Status</label><div class="tg"><button type="button" id="f-on" onclick="setOn(true)">Chalu</button><button type="button" id="f-off" onclick="setOn(false)">Band</button></div>'
      + '<div class="err" id="err"></div>'
      + '<div class="btns"><button type="button" class="pri" onclick="saveSub(\'' + esc(pid) + '\',\'' + esc(sid || '') + '\')">Save</button>'
      + (c ? '<button type="button" class="del" id="delbtn" onclick="delSub(\'' + esc(pid) + '\',\'' + esc(sid) + '\')">\ud83d\uddd1 Delete</button>' : '') + '</div></div>';
    m.style.display = 'flex'; m.onclick = closeModal;
    setOn(!c || c.on !== false);
    if (!c) setTimeout(function () { try { $('f-name').focus(); } catch (e) {} }, 60);
  }
  function saveSub(pid, sid) {
    var name = ($('f-name').value || '').trim().replace(/\s+/g, ' ');
    var amtRaw = ($('f-amt').value || '').trim();
    var note = ($('f-note').value || '').trim();
    var err = $('err');
    if (!name) { err.textContent = 'Sub-category ka naam likho'; return; }
    var amt = 0;
    if (amtRaw !== '') { amt = Number(amtRaw); if (!isFinite(amt) || amt < 0) { err.textContent = 'Amount sahi likho (0 ya zyada)'; return; } }
    var b = load(), p = b.src.filter(function (x) { return x.id === pid; })[0];
    if (!p) { closeModal(); return; }
    if (!Array.isArray(p.subs)) p.subs = [];
    if (p.subs.some(function (x) { return x.id !== sid && String(x.name || '').trim().toLowerCase() === name.toLowerCase(); })) { err.textContent = 'Is source me ye naam pehle se hai'; return; }
    var now = Date.now();
    if (sid) {
      var c = p.subs.filter(function (x) { return x.id === sid; })[0];
      if (!c) { closeModal(); return; }
      c.name = name; c.amt = amt; c.note = note; c.on = formOn; c.t = now;
    } else {
      p.subs.push({ id: uid(), name: name, amt: amt, note: note, on: formOn, t: now });
    }
    p.t = now; recalc(p);
    if (!persist(b)) { err.textContent = 'Save nahi hua (phone storage)'; return; }
    closeModal(); render();
  }
  function delSub(pid, sid) {
    var btn = $('delbtn'); if (!btn) return;
    if (!btn.classList.contains('cf')) {
      btn.classList.add('cf'); btn.textContent = 'Pakka delete?';
      setTimeout(function () { var x = $('delbtn'); if (x) { x.classList.remove('cf'); x.textContent = '\ud83d\uddd1 Delete'; } }, 3500);
      return;
    }
    var b = load(), p = b.src.filter(function (x) { return x.id === pid; })[0];
    if (p) { p.subs = subsOf(p).filter(function (x) { return x.id !== sid; }); p.t = Date.now(); recalc(p); }
    persist(b); closeModal(); render();
  }
  window.openSub = openSub; window.saveSub = saveSub; window.delSub = delSub;
  window.openEdit = openEdit; window.closeModal = closeModal; window.setOn = setOn; window.saveSrc = saveSrc; window.delSrc = delSrc;
  window.toggleIncomeSrc = function () {
    try { if (window._lionExit) { window._lionExit(); return; } } catch (e) {}
    try { if (window.LionRt && LionRt.close) { LionRt.close(); return; } } catch (e) {}
    try { history.back(); } catch (e) {}
  };

  render(); chip();
  syncNow(false);
})();
</script>
</body></html>
